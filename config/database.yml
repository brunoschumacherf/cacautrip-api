default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgresql://postgres:postgres@db:5432/cacautrip_development" } %>

test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgresql://postgres:postgres@db:5432/cacautrip_test" } %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgresql://postgres:postgres@db:5432/cacautrip_production" } %>