          description: Conflito de estado, duplicidade ou operação simultânea
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Validação ou regra de negócio não atendida
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: Limite de tentativas excedido; aguarde
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SupportInput"
            example:
              message: Preciso de ajuda com o pagamento da minha reserva.
