        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reward_id:
                  type: integer
                  format: int64
                request_key:
                  type: string
                  minLength: 12
                  maxLength: 100
                  pattern: "^[a-zA-Z0-9_-]+$"
                  example: resgate-ilheus-20261120-001
              required:
              - reward_id
              - request_key
            example:
              reward_id: 1
              request_key: resgate-exemplo-20261120-001
  "/map_points":
    get:
      operationId: get_map_points
      summary: Listar locais e serviços do mapa
      description: Independente da paginação do catálogo. Destinos ativos, trilhas
        públicas, coleta, parceiros, profissionais publicados/verificados e apoio
        cadastrado. Guia/motorista representa área de atendimento, não posição em
        tempo real. approximate identifica resultados por rua/região. category distingue
        hospitais/delegacias. Endereços sem coordenadas ficam em unlocated; o cliente
        pode atualizar após o processamento. Não é uma busca genérica de estabelecimentos
        externos.
      tags:
      - Catálogo e destinos
      security: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      "$ref": "#/components/schemas/MapPoint"
                  total:
                    type: integer
                    format: int64
                  unlocated_count:
                    type: integer
                    format: int64
                  unlocated:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        kind:
                          type: string
                        name:
                          type: string
                        address:
                          type: string
                          nullable: true
                  counts:
                    type: object
                    properties: {}
        '422':
          description: Validação ou regra de negócio não atendida
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - name: q
        in: query
        required: false
        description: Busca por nome, endereço, cidade e categoria.
        schema:
          type: string
      - name: kinds
        in: query
        required: false
        description: 'Tipos separados por vírgula: destination,trail,collection,partner,guide,driver,emergency.'
        schema:
          type: string
