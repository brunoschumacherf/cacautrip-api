      description: |-
        Somente admin tem gestão integral. Suporte lê users, bookings, tickets, reports, reviews, messages, incidents, alerts, emergency_points e escreve tickets, reports, reviews, messages, incidents. Operador de coleta não acessa estes recursos: só emite códigos no ponto vinculado. tickets redireciona à tela dedicada de atendimento humano; não use o formulário genérico para responder.
        Recursos e campos editáveis (campos omitidos não são alterados):
        - eco_collection_points (Pontos de coleta): name, city, address, description, materials, opening_hours, image_url, latitude, longitude, active. Criação: sim; exclusão física: não.
        - eco_partners (Parceiros sustentáveis): name, city, address, description, image_url, latitude, longitude, active. Criação: sim; exclusão física: não.
        - eco_rewards (Benefícios e descontos verdes): title, description, scope, eco_partner_id, image_url, discount_type, discount_value, minimum_amount, maximum_discount, points_cost, stock, expires_at, active. Criação: sim; exclusão física: não.
        - users (Usuários): name, email, suspended. Criação: não; exclusão física: não.
        - guides (Guias): moderation_status, verified_documents, available, region, specialization, languages, description, services, document_reference. Criação: não; exclusão física: não.
        - drivers (Motoristas): moderation_status, verified_cnh, available, vehicle_model, license_plate, capacity, region, services, document_reference. Criação: não; exclusão física: não.
        - destinations (Atrações e serviços): name, category, city, description, image_url, latitude, longitude, price, duration_minutes, opening_hours, rules, accessible, guide_required, active, best_time, provider_id. Criação: sim; exclusão física: não.
        - trails (Trilhas dos guias): status. Criação: não; exclusão física: não.
        - emergency_points (Emergência): name, category, phone, address, latitude, longitude. Criação: sim; exclusão física: sim, somente admin.
        - alerts (Comunicados e alertas): title, body, kind, region, source_url, expires_at. Criação: sim; exclusão física: sim, somente admin.
