    staffSession:
      type: apiKey
      in: cookie
      name: _cacautrip_staff
      description: Cookie HttpOnly do painel /gestao. AdminUser é separado do usuário
        do app. Entre no painel no navegador da mesma origem; Swagger não define manualmente
        o cabeçalho Cookie. Escritas exigem CSRF.
