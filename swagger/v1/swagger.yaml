        - reports (Denúncias): status. Criação: não; exclusão física: não.
        - messages (Conteúdos do chat): hidden. Criação: não; exclusão física: não.
        - tickets (Solicitações de suporte): reply, status. Criação: não; exclusão física: não.
        - bookings (Reservas e pagamentos): . Criação: não; exclusão física: não.
        - wallet_entries (Carteiras e repasses): . Criação: não; exclusão física: não.
        - subscriptions (Assinaturas): status, auto_renew. Criação: não; exclusão física: não.
        - subscription_orders (Pagamentos de planos): . Criação: não; exclusão física: não.
        - incidents (Falhas técnicas): status, resolution. Criação: não; exclusão física: não.
        - admin_users (Equipe e permissões): name, email, role, eco_collection_point_id, active, password, password_confirmation. Criação: sim; exclusão física: não.
        - audits (Auditoria): . Criação: não; exclusão física: não.
        Dados de usuário do app não criam AdminUser. Somente admin cria/edita equipe. Operador exige eco_collection_point_id. Alterar senha, papel, ativação ou ponto invalida sessões. Não permite desativar/rebaixar o último admin ativo. Guias/motoristas exigem Gov.br e documento para publicação.
        AdminUser com as permissões descritas. HTML e cookie de sessão; não usa Bearer. Sem sessão redireciona a /gestao/entrar. Escritas exigem CSRF do formulário/meta csrf-token.
