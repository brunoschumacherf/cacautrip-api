      description: Débito/estoque/cupom atômicos. request_key idempotente por conta;
        outro benefício com mesma chave é inválido. Congela termos/endereço, validade
        até 30 dias ou validade do benefício. Parceiro valida código no painel; trilha/motorista
        usa redemption_id ao pagar.
