  "/cable":
    get:
      operationId: get_cable
      summary: Conectar ao WebSocket ActionCable
      description: 'Upgrade WebSocket, não executável pelo Try it out HTTP comum.
        Após welcome, envie command=subscribe com identifier sendo JSON serializado
        de {channel: ConversationChannel, conversation_id: 1}. Recebe confirm_subscription,
        ping e frames {identifier, message}. Envio de conteúdo permanece pelo POST
        REST. Suporte usa polling, não este canal.'
      tags:
      - Mensagens
      security: []
      responses:
        '101':
          description: Upgrade WebSocket
        '401':
          description: 'Conexão recusada: ticket inválido ou usuário indisponível'
      parameters:
      - name: ticket
        in: query
        required: true
        description: Ticket de /cable_ticket, não Bearer.
        schema:
          type: string
      x-actioncable-example:
        command: subscribe
        identifier: '{"channel":"ConversationChannel","conversation_id":1}'
