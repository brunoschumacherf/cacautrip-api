---
openapi: 3.0.1
info:
  title: API Cacautrip
  version: v1
  description: |
    Documentação dos endpoints declarados em config/routes.rb e dos contratos dos controllers, incluindo aliases PUT/PATCH gerados por resources, painel ActionView e handshake ActionCable. Nenhuma chamada é executada durante a geração.

    ## Autenticação e permissões
    API do app: Bearer obtido em signup/login/Google finish, validade de sete dias. Permissões usam a conta autenticada; IDs enviados não concedem acesso a dados alheios. Profissional novo precisa verificar Gov.br e passar por aprovação.
    Painel Rails: cookie AdminUser e CSRF. admin tem gestão integral; suporte atende/modera, emite códigos e valida cupons de parceiros; operador_coleta só emite códigos do ponto vinculado e consulta seus próprios códigos. User.admin da API legada não concede automaticamente sessão AdminUser.

    ## Implementações de demonstração
    Gov.br atualiza diretamente gov_verified=true; não há consulta real de CPF. Pix aprova na quarta consulta POST de status; cartão aprova sem gateway/dados de cartão. Saques/repasses também são simulados. Google exige configuração OAuth real. O suporte usa IA via endpoint configurado ou ajuda local na ausência dele.

    ## Contratos e paginação
    Campos desconhecidos são ignorados conforme strong parameters. Schemas de atualização descrevem campos permitidos, não obrigam reenviar todos os atributos. Modelos continuam sujeitos às validações do banco/aplicação. Decimais persistidos podem ser strings e calculados números. Timestamps usam ISO 8601; interfaces exibem horários da Bahia. Rotas privadas exigem autenticação mesmo quando retornam 404 para registros fora do escopo.
    Catálogo tem paginação opt-in. Listagens com limites fixos e mensagens com cursores têm regras descritas na operação; não existe paginação global implícita.

    ## Swagger e endpoints HTML
    Authorize recebe apenas o token (sem prefixo Bearer). Para HTML, entre primeiro em /gestao/entrar na mesma origem e obtenha CSRF do formulário. Formulários usam application/x-www-form-urlencoded e nomes Rails como record[address]. A interface não automatiza o handshake WebSocket nem a autorização externa Google. As rotas de arquivos internos dos engines Rails/Rswag não são tratadas como APIs de negócio.
servers:
- url: http://localhost:3000
  description: Desenvolvimento local
tags:
- name: Autenticação
- name: Google OAuth
- name: Conta e privacidade
- name: Catálogo e destinos
- name: Perfis profissionais
- name: Roteiros
- name: Trilhas e saídas
- name: Reservas e pagamentos
- name: Mensagens
- name: Carteira
- name: Assinaturas
- name: Avaliações e denúncias
- name: Notificações
- name: Suporte
- name: Sustentabilidade
- name: Administração JSON legada
- name: Painel Rails (HTML)
- name: Painel Rails (JSON de apoio)
- name: Infraestrutura
security:
- bearerAuth: []
paths:
  "/signup":
    post:
      operationId: post_signup
      summary: Cadastrar turista
      description: Campos na raiz ou em authentication. Conta começa com gov_verified=false.
        Não aceita admin, user_id ou papéis profissionais. GET /me fornece o perfil
        completo.
      tags:
      - Autenticação
      security: []
      responses:
        '201':
          description: Registro criado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResult"
        '400':
          description: Parâmetro obrigatório ausente ou malformado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Validação ou regra de negócio não atendida
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: Limite de tentativas excedido; aguarde
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SignupInput"
            example:
              name: Ana Lima
              email: ana@example.com
              password: SenhaExemplo!2026
              password_confirmation: SenhaExemplo!2026
  "/login":
    post:
      operationId: post_login
      summary: Entrar com e-mail e senha
      description: Campos na raiz ou em authentication. E-mail normalizado; sessão
        Rails assinada de sete dias. Conta suspensa não entra.
      tags:
      - Autenticação
      security: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResult"
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: Limite de tentativas excedido; aguarde
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginInput"
            example:
              email: ana@example.com
              password: SenhaExemplo!2026
  "/me":
    get:
      operationId: get_me
      summary: Consultar minha conta e papéis
      description: ''
      tags:
      - Conta e privacidade
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      operationId: patch_me
      summary: Atualizar dados, preferências ou papel ativo
      description: guide/driver exigem Gov.br verificado e o perfil correspondente.
        Não altera admin, google_uid ou verificação de identidade.
      tags:
      - Conta e privacidade
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '403':
          description: Permissão ou requisito de identidade não atendido
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Validação ou regra de negócio não atendida
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileInput"
  "/me/verify_gov":
    post:
      operationId: post_me_verify_gov
      summary: Verificar Gov.br no fluxo de demonstração
      description: 'Simulado: define gov_verified=true. Ainda não verifica CPF/documentos
        com provedor real. Aprovação profissional é separada.'
      tags:
      - Conta e privacidade
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
                  verification_status:
                    type: string
                    enum:
                    - verified
                  message:
                    type: string
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/privacy/export":
    get:
      operationId: get_privacy_export
      summary: Exportar meus dados pessoais
      description: Somente dados da conta autenticada; inclui suporte, sustentabilidade,
        cupons e extrato de pontos.
      tags:
      - Conta e privacidade
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported_at:
                    type: string
                    format: date-time
                  profile:
                    "$ref": "#/components/schemas/User"
                  routes:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Route"
                  bookings:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Booking"
                  wallet:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WalletEntry"
                  subscriptions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Subscription"
                  reviews:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Review"
                  tickets:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SupportConversation"
                  eco_vouchers:
                    type: array
                    items:
                      "$ref": "#/components/schemas/EcoVoucher"
                  eco_points_history:
                    type: array
                    items:
                      type: object
                      properties: {}
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/privacy/deletion_request":
    post:
      operationId: post_privacy_deletion_request
      summary: Solicitar exclusão/anonimização
      description: 'Abre chamado humano. Não exclui imediatamente: equipe analisa
        titularidade, retenção e pendências.'
      tags:
      - Conta e privacidade
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Registro criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ticket_id:
                    type: integer
                    format: int64
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/auth/google/start":
    post:
      operationId: post_auth_google_start
      summary: Iniciar cadastro/login ou vinculação Google
      description: Sem Bearer inicia login/cadastro; com Bearer vincula a conta autenticada.
        redirect_uri deve constar exatamente em GOOGLE_APP_REDIRECT_URIS. Requer GOOGLE_CLIENT_ID,
        GOOGLE_CLIENT_SECRET, GOOGLE_CALLBACK_URL e GOOGLE_APP_REDIRECT_URIS. Guarde
        exchange_secret localmente e abra authorization_url. Tentativa válida por
        dez minutos.
      tags:
      - Google OAuth
      security:
      - {}
      - bearerAuth: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url:
                    type: string
                    format: uri
                  exchange_secret:
                    type: string
                  flow_id:
                    type: integer
                    format: int64
        '422':
          description: Validação ou regra de negócio não atendida
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: Limite de tentativas excedido; aguarde
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: Serviço indisponível ou integração não configurada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                  example: http://localhost:8081/google-callback
              required:
              - redirect_uri
            example:
              redirect_uri: http://localhost:8081/google-callback
  "/auth/google/callback":
    get:
      operationId: get_auth_google_callback
      summary: Receber retorno do Google
      description: 'Callback do navegador. Verifica ID token e redireciona ao app
        com code temporário e flow; erros: cancelled, account_exists, invalid_identity.
        Não vincula contas apenas pelo e-mail. O code retornado ao app é diferente
        do código OAuth do Google.'
      tags:
      - Google OAuth
      security: []
      responses:
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '302':
          description: Retorno autorizado ao app com código válido por dois minutos,
            uso único, ou erro.
          headers:
            Location:
              schema:
                type: string
      parameters:
      - name: state
        in: query
        required: true
        description: State do fluxo.
        schema:
          type: string
      - name: code
        in: query
        required: false
        description: Código OAuth obrigatório no sucesso.
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: Cancelamento/erro do Google.
        schema:
          type: string
  "/auth/google/finish":
    post:
      operationId: post_auth_google_finish
      summary: Trocar código temporário por sessão
      description: Exige flow_id, code retornado ao app e segredo guardado no início.
        Consome uma única vez. Novas contas são turistas sem Gov.br verificado.
      tags:
      - Google OAuth
      security: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResult"
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Permissão ou requisito de identidade não atendido
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_id:
                  type: integer
                  format: int64
                code:
                  type: string
                exchange_secret:
                  type: string
              required:
              - flow_id
              - code
              - exchange_secret
            example:
              flow_id: 1
              code: codigo-temporario-do-retorno
              exchange_secret: segredo-recebido-no-inicio
  "/health":
    get:
      operationId: get_health
      summary: Consultar Rails e PostgreSQL
      description: ''
      tags:
      - Infraestrutura
      security: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - unavailable
                  database:
                    type: string
                    enum:
                    - available
                    - unavailable
        '503':
          description: Banco indisponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
                  database:
                    type: string
                    enum:
                    - unavailable
  "/catalog":
    get:
      operationId: get_catalog
      summary: Consultar destinos, alertas e apoio
      description: 'Paginação opt-in com page/per_page: padrão 6, máximo 30; resposta
        inclui pagination. Sem ambos retorna destinos completos para mapas/roteiros.
        Páginas fora do intervalo são ajustadas. Coordenadas juntas ordenam todo o
        conjunto por distância antes do recorte e adicionam distance_km. Sem coordenadas
        ordena por nome/id. Alertas e apoio não são paginados.'
      tags:
      - Catálogo e destinos
      security: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Catalog"
      parameters:
      - name: q
        in: query
        required: false
        description: Nome, cidade ou descrição.
        schema:
          type: string
      - name: category
        in: query
        required: false
        description: Categoria exata.
        schema:
          type: string
      - name: accessible
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: budget
        in: query
        required: false
        description: Preço máximo por destino.
        schema:
          type: number
      - name: latitude
        in: query
        required: false
        description: ''
        schema:
          type: number
      - name: longitude
        in: query
        required: false
        description: ''
        schema:
          type: number
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 30
          default: 6
  "/destinations/{id}":
    get:
      operationId: get_destinations_id
      summary: Consultar destino ativo
      description: ''
      tags:
      - Catálogo e destinos
      security: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Destination"
        '404':
          description: Registro inexistente, não público ou fora do escopo
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador limitado ao escopo descrito.
        schema:
          type: integer
          format: int64
          minimum: 1
  "/professional_profiles/guides":
    get:
      operationId: get_professional_profiles_guides
      summary: Listar guias públicos
      description: Exige publicação, Gov.br verificado e conta não suspensa. available=true
        limita a disponíveis. Ordena por destaque da assinatura, avaliação e preço.
        Sem paginação. Omissão de referência documental e placa nos dados públicos.
      tags:
      - Perfis profissionais
      security: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Professional"
      parameters:
      - name: q
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: region
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: specialization
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: services
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: available
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: accessible
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: max_price
        in: query
        required: false
        description: ''
        schema:
          type: number
      - name: min_rating
        in: query
        required: false
        description: ''
        schema:
          type: number
          minimum: 0
          maximum: 5
  "/professional_profiles/drivers":
    get:
      operationId: get_professional_profiles_drivers
      summary: Listar motoristas públicos
      description: Exige publicação, Gov.br verificado e conta não suspensa. available=true
        limita a disponíveis. Ordena por destaque da assinatura, avaliação e preço.
        Sem paginação. Omissão de referência documental e placa nos dados públicos.
      tags:
      - Perfis profissionais
      security: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Professional"
      parameters:
      - name: q
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: region
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: specialization
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: services
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: available
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: accessible
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: max_price
        in: query
        required: false
        description: ''
        schema:
          type: number
      - name: min_rating
        in: query
        required: false
        description: ''
        schema:
          type: number
          minimum: 0
          maximum: 5
      - name: people
        in: query
        required: false
        description: Capacidade mínima.
        schema:
          type: integer
          format: int64
          minimum: 1
  "/professional_profiles/{kind}/{id}":
    get:
      operationId: get_professional_profiles_kind_id
      summary: Consultar perfil público
      description: kind=guide ou driver. Somente publicado, com Gov.br verificado
        e conta não suspensa.
      tags:
      - Perfis profissionais
      security: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Professional"
        '404':
          description: Registro inexistente, não público ou fora do escopo
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - name: kind
        in: path
        required: true
        description: Identificador limitado ao escopo descrito.
        schema:
          type: string
          enum:
          - guide
          - driver
      - name: id
        in: path
        required: true
        description: Identificador limitado ao escopo descrito.
        schema:
          type: integer
          format: int64
          minimum: 1
  "/professional_profiles/guide":
    post:
      operationId: post_professional_profiles_guide
      summary: Criar/atualizar meu perfil guide
      description: Retorna 200 inclusive no primeiro cadastro. Usa o usuário Bearer,
        não recebe user_id nem subscription_plan. Exige gov_verified=true. Novos perfis
        ou alteração de document_reference ficam pending até aprovação administrativa.
        Campos obrigatórios do schema descrevem a criação; em atualização podem ser
        omitidos se já preenchidos. Assinaturas têm endpoints próprios.
      tags:
      - Perfis profissionais
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    "$ref": "#/components/schemas/PrivateProfessional"
        '400':
          description: Parâmetro obrigatório ausente ou malformado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Permissão ou requisito de identidade não atendido
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Validação ou regra de negócio não atendida
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Sessão inválida, ausente, expirada ou conta suspensa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GuideInput"
            example:
              region: Ilhéus
              specialization: Ecoturismo e trilhas
              languages: Português, Inglês
              description: Experiências na Costa do Cacau.
              image_url: https://example.com/guia.jpg
              document_reference: REFERENCIA-DOCUMENTAL
              price: 120
              available: true
              accessible: false
              services: Trilhas e passeios
  "/professional_profiles/driver":
    post:
      operationId: post_professional_profiles_driver
      summary: Criar/atualizar meu perfil driver
      description: Retorna 200 inclusive no primeiro cadastro. Usa o usuário Bearer,
        não recebe user_id nem subscription_plan. Exige gov_verified=true. Novos perfis
